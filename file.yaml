# ============================================================
# 07-ingress.yaml
# Ingress — 外部トラフィックの単一エントリーポイント
# Ingress — Single entry point for all external HTTP/S traffic
# ============================================================
#
# 【ENGLISH】
# Ingress = the front door for your cluster.
# One AWS ALB routes ALL your apps based on hostname or URL path.
#
# Without Ingress: each Service needs its own LoadBalancer = 1 ALB per app
# With Ingress:    one ALB for everything = cheaper, easier to manage
#
# Requires: AWS Load Balancer Controller installed on EKS.
# Install guide: https://docs.aws.amazon.com/eks/latest/userguide/aws-load-balancer-controller.html
#
# Key annotations for EKS ALB:
#   alb.ingress.kubernetes.io/scheme: internet-facing → public ALB
#   alb.ingress.kubernetes.io/target-type: ip → routes to pod IPs directly (faster)
#   alb.ingress.kubernetes.io/certificate-arn → HTTPS with ACM certificate
#
# 【日本語】
# Ingress = クラスターの玄関口。
# 1つの AWS ALB がホスト名または URL パスで全アプリにルーティング。
#
# Ingress なし: 各 Service が独自の LoadBalancer を必要とする = アプリごとに 1 ALB
# Ingress あり: 全アプリに対して 1つの ALB = コスト削減、管理が簡単
#
# 必要なもの: EKS に AWS Load Balancer Controller のインストール
#
# EKS ALB の主要アノテーション：
#   alb.ingress.kubernetes.io/scheme: internet-facing → 公開 ALB
#   alb.ingress.kubernetes.io/target-type: ip → Pod IP に直接ルーティング（高速）
#   alb.ingress.kubernetes.io/certificate-arn → ACM 証明書で HTTPS
#
# Apply: kubectl apply -f 07-ingress.yaml
# Check: kubectl get ingress -n production
#        kubectl describe ingress my-app-ingress -n production
# ============================================================

apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: my-app-ingress
  namespace: production
  labels:
    app: my-app
  annotations:
    # AWS ALB Ingress Controller を使用
    kubernetes.io/ingress.class: alb

    # internet-facing = インターネットからアクセス可能
    # internal = VPC 内からのみアクセス可能
    alb.ingress.kubernetes.io/scheme: internet-facing

    # ip モード = Pod IP に直接ルーティング（推奨）
    alb.ingress.kubernetes.io/target-type: ip

    # ヘルスチェックパス（アプリのエンドポイントに合わせて変更）
    alb.ingress.kubernetes.io/healthcheck-path: /health

    # HTTPS を有効にする場合（ACM 証明書の ARN を指定）
    # Uncomment to enable HTTPS with ACM certificate:
    # alb.ingress.kubernetes.io/certificate-arn: arn:aws:acm:REGION:ACCOUNT_ID:certificate/CERT-ID
    # alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # alb.ingress.kubernetes.io/ssl-redirect: '443'

spec:
  rules:
    # !! ドメイン名に変更 / Replace with your actual domain !!
    - host: api.yourdomain.com
      http:
        paths:
          # 全トラフィックを my-app-svc に転送
          # Route all traffic to my-app-svc
          - path: /
            pathType: Prefix
            backend:
              service:
                name: my-app-svc
                port:
                  number: 80

          # 複数サービスへのルーティング例 / Example multi-service routing:
          # - path: /api
          #   pathType: Prefix
          #   backend:
          #     service:
          #       name: api-svc
          #       port:
          #         number: 80
          # - path: /auth
          #   pathType: Prefix
          #   backend:
          #     service:
          #       name: auth-svc
          #       port:
          #         number: 80
EOF

