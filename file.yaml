# ============================================================
# 08-hpa.yaml
# HorizontalPodAutoscaler — 自動スケーリング
# HorizontalPodAutoscaler — Automatic pod scaling
# ============================================================
#
# 【ENGLISH】
# HPA watches CPU/memory usage and automatically:
#   - Scales UP   (adds pods)   when load is high
#   - Scales DOWN (removes pods) when load is low
#
# HPA works by adjusting Deployment.spec.replicas automatically.
# Do NOT manually change replicas in your Deployment when HPA is active
# — HPA will override it anyway.
#
# HPA decision formula:
#   desiredReplicas = ceil(currentReplicas × (currentMetric / targetMetric))
#   Example: 3 pods × (90% CPU / 70% target) = ceil(3.857) = 4 pods
#
# Requires: metrics-server installed on EKS
# Install: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
# 【日本語】
# HPA は CPU/メモリ使用率を監視して自動的に：
#   - スケールアップ（Pod を追加）負荷が高いとき
#   - スケールダウン（Pod を削除）負荷が低いとき
#
# HPA は Deployment.spec.replicas を自動的に調整する仕組み。
# HPA が有効なとき Deployment の replicas を手動変更しないこと
# — HPA が上書きするので意味がない。
#
# HPA の計算式：
#   望む Pod 数 = ceil(現在の Pod 数 × (現在のメトリクス / 目標メトリクス))
#   例: 3 Pod × (90% CPU / 70% 目標) = ceil(3.857) = 4 Pod
#
# 必要なもの: EKS に metrics-server のインストール
# インストール: kubectl apply -f https://github.com/kubernetes-sigs/metrics-server/releases/latest/download/components.yaml
#
# Apply: kubectl apply -f 08-hpa.yaml
# Check: kubectl get hpa -n production
#        kubectl describe hpa my-app-hpa -n production
# Watch: kubectl get hpa -n production -w
# ============================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: my-app-hpa
  namespace: production
  labels:
    app: my-app
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: my-app   # 05-deployment.yaml の name と一致させること

  minReplicas: 3    # 最小 Pod 数（05-deployment.yaml の replicas と合わせる）
  maxReplicas: 10   # 最大 Pod 数

  metrics:
    # CPU 使用率でスケール / Scale on CPU usage
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70   # 平均 CPU 70% を超えたらスケールアップ

    # メモリ使用率でスケール（オプション）/ Scale on memory (optional)
    # - type: Resource
    #   resource:
    #     name: memory
    #     target:
    #       type: Utilization
    #       averageUtilization: 80

  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60    # スケールアップ後 60秒は再スケールアップしない
      policies:
        - type: Pods
          value: 2                       # 1回のスケールイベントで最大 2 Pod 追加
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300   # スケールダウン前に 5分間待つ（過剰反応防止）
      policies:
        - type: Pods
          value: 1                       # 1回のスケールイベントで最大 1 Pod 削除
          periodSeconds: 60
EOF

