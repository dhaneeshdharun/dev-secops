apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argo-cd
spec:
  project: default  
  source:
    repoURL: https://github.com/dhaneeshdharun/dev-secops.git
    targetRevision: dev-staging
    path: helm-argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  syncOptions:
    - CreateNamespace=true
