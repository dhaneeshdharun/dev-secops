apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: ArgoCD
  namespace: argocd
spec:
  project: default  
  source:
    repoURL: https://github.com/dhaneeshdharun/dev-secops.git
    targetRevision: dev-staging
    path: helm-arogcd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
