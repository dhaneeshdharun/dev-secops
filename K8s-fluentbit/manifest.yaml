apiVersion: v1
kind: Namespace
metadata:
  name: fluentbit
  labels:
    app: app-fluentbit
    env: logging

---

apiVersion: v1
kind: ServiceAccount
metadata:
  name: fluentbit-serviceaccount
  namespace: fluentbit
  labels:
    app: app-fluentbit
    env: logging
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::311414082845:role/fluentbit-serviceaccount-role

---

apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: fluentbit-role
  namespace: fluentbit
  labels:
    app: app-fluentbit
    env: logging
rules:  
- apiGroups: [""]
  resources: ["pods", "namespaces", "nodes"]
  verbs: ["get", "watch", "list"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: fluentbit-rolebinding
  namespace: fluentbit
  labels:
    app: app-fluentbit
    env: logging
subjects:
- kind: ServiceAccount
  name: fluentbit-serviceaccount
  namespace: fluentbit
roleRef:
  kind: ClusterRole   
  name: fluentbit-role
  apiGroup: rbac.authorization.k8s.io

---

# ============================================================
# ConfigMap — Fluent Bit Configuration
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: fluentbit-config
  namespace: fluentbit
  labels:
    app: app-fluentbit
    env: logging
data:
  fluent-bit.conf: |
    [SERVICE]
        Flush         5
        Daemon        Off
        Log_Level     info
        Parsers_File  parsers.conf

    [INPUT]
        Name              tail
        Tag               kube.*
        Path              /var/log/containers/*.log
        Parser            docker
        DB                /var/log/flb_kube.db
        Mem_Buf_Limit     5MB
        Skip_Long_Lines   On
        Refresh_Interval  10

    [FILTER]
        Name                kubernetes
        Match               kube.*
        Kube_URL            https://kubernetes.default.svc:443
        Kube_CA_File        /var/run/secrets/kubernetes.io/serviceaccount/ca.crt
        Kube_Token_File     /var/run/secrets/kubernetes.io/serviceaccount/token
        Merge_Log           On
        Keep_Log            On
        K8S-Logging.Parser  On
        K8S-Logging.Exclude Off
        Labels              On
        Annotations         Off

    [OUTPUT]
        Name               cloudwatch_logs
        Match              kube.*
        region             ap-northeast-1
        log_group_name     /eks/fluentbit/logs
        log_stream_prefix  fluent-bit-
        auto_create_group  true

  parsers.conf: |
    [PARSER]
        Name        docker
        Format      json
        Time_Key    time
        Time_Format %Y-%m-%dT%H:%M:%S.%L
        Time_Keep   On

---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: fluentbit-daemonset
  namespace: fluentbit
  labels:
    app: app-fluentbit
    env: logging
spec:
  selector:
    matchLabels:
      app: app-fluentbit
      env: logging
  template:
    metadata:
      labels:
        app: app-fluentbit
        env: logging
    spec:
      serviceAccountName: fluentbit-serviceaccount
      dnsPolicy: ClusterFirst        # ← fixed
      containers:
        - name: fluent-bit
          image: fluent/fluent-bit:latest
          imagePullPolicy: Always
          volumeMounts:
            - name: varlog
              mountPath: /var/log
            - name: varlibdockercontainers
              mountPath: /var/lib/docker/containers
              readOnly: true
            - name: fluentbit-config
              mountPath: /fluent-bit/etc/
          resources:
            limits:
              memory: 1500Mi
            requests:
              cpu: 500m
              memory: 500Mi
      # hostNetwork: true  ← removed
      volumes:
        - name: varlog
          hostPath:
            path: /var/log
        - name: varlibdockercontainers
          hostPath:
            path: /var/lib/docker/containers
        - name: fluentbit-config
          configMap:
            name: fluentbit-config